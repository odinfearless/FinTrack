# ---------------------------------------------------------------------------
# FinTrack — Postgres + app.
#
#   docker compose up -d --build     sobe os dois
#   docker compose up -d banco       só o banco, para rodar o app na máquina
#
# O segundo caso é o do dia a dia de desenvolvimento: o `npm run dev` continua
# valendo, com recarga automática, e o banco fica no container.
# ---------------------------------------------------------------------------

services:
  banco:
    image: postgres:17-alpine
    container_name: fintrack-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintrack}
      POSTGRES_DB: ${POSTGRES_DB:-fintrack}
      # O banco guarda datas e textos em português; o locale evita que a
      # ordenação de nome saia com acento fora de lugar.
      LANG: pt_BR.utf8
    ports:
      # Preso ao 127.0.0.1 de propósito: o app do compose fala com o banco pela
      # rede interna e não precisa desta porta. Ela existe só para o
      # `npm run dev` da própria máquina alcançar o banco — e publicada em
      # 0.0.0.0 deixaria o Postgres, com a senha padrão, aberto a qualquer
      # máquina da rede local.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      # É o que segura o app até o banco aceitar conexão de verdade. Sem isso,
      # `depends_on` só garante que o container iniciou — e o Postgres sobe,
      # reinicia uma vez durante a criação do cluster, e só então atende.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fintrack} -d ${POSTGRES_DB:-fintrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Modelo de linguagem local. É ele que classifica o estabelecimento que o
  # histórico nunca viu e que lê o print de celular melhor que o Tesseract.
  #
  # Roda em container como o resto, mas com uma exigência a mais: a GPU. Sem o
  # passthrough abaixo o Ollama cai para CPU — continua funcionando, e para
  # classificar texto até serve, mas a leitura de imagem passa de segundos para
  # minutos.
  # ---------------------------------------------------------------------------
  ia:
    image: ollama/ollama:latest
    container_name: fintrack-ia
    restart: unless-stopped
    environment:
      # Mantém o modelo residente na VRAM entre uma importação e outra. Sem
      # isto, cada chamada recarrega alguns GB e a primeira resposta demora
      # dezenas de segundos — o suficiente para parecer travado.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    volumes:
      # Por padrão um volume nomeado. `OLLAMA_MODELS` no .env aponta para uma
      # pasta do host quando já existem modelos baixados lá — evita baixar os
      # mesmos gigabytes duas vezes.
      - ${OLLAMA_MODELS:-dados-ollama}:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  app:
    build: .
    container_name: fintrack-app
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
      # Sem `service_healthy` de propósito: a IA é uma camada opcional. Se ela
      # demorar a subir ou estiver fora, o app tem que atender assim mesmo e
      # sugerir pelo histórico — esperar por ela seria trocar uma melhoria por
      # uma dependência.
      ia:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3333
      # `banco` é o nome do serviço, que no compose já é o nome de rede.
      DATABASE_URL: postgres://${POSTGRES_USER:-fintrack}:${POSTGRES_PASSWORD:-fintrack}@banco:5432/${POSTGRES_DB:-fintrack}
      # `ia` é o nome do serviço, que no compose já é nome de rede.
      IA_URL: ${IA_URL:-http://ia:11434}
      IA_MODELO_TEXTO: ${IA_MODELO_TEXTO:-qwen3:8b}
      IA_MODELO_VISAO: ${IA_MODELO_VISAO:-qwen3-vl:8b}
    ports:
      - "${APP_PORT:-3333}:3333"
    volumes:
      # Os backups das limpezas são arquivos, e precisam sobreviver ao
      # container: sem este mapeamento, o que a tela promete guardar sumiria
      # no primeiro `docker compose down`.
      - ./data:/app/data

volumes:
  dados-postgres:
  dados-ollama:
